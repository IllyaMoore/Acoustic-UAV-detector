[project]
name = "uavdoa"
version = "0.1.0"
description = "Reference DSP for the acoustic UAV detector: array geometry, GCC-PHAT, azimuth solver, simulation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uavdoa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
