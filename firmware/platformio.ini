; PlatformIO wrapper around a plain ESP-IDF project - `idf.py build` works too.
;
;   pio run -e esp32dev              build for the WROOM-32 devkit (board on hand)
;   pio run -e esp32dev -t upload    flash it
;   pio device monitor               watch the $UAVDOA sentences
;   pio run -e esp32dev -t menuconfig   node id, heading, FIFO offset, pins...
[platformio]
src_dir = main
default_envs = esp32dev

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
